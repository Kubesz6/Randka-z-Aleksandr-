<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuba ❤️ Aleksandra</title>

<script 
src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#4c1d95);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:700px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    text-align:center;
}

h1{
    color:#ff8fc7;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
}

#yesBtn{
    background:#22c55e;
    color:white;
}

#noBtn{
    background:#ef4444;
    color:white;
    position:absolute;
}

.buttons{
    position:relative;
    height:120px;
}

.hidden{
    display:none;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}

#result{
    margin-top:20px;
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:15px;
}
</style>

</head>
<body>

<div class="container">

<h1>❤️ Kuba & Aleksandra ❤️</h1>

<p>
Poznaliśmy się 15.07.2023 ❤️<br>
Razem jesteśmy od 22.03.2024 ❤️
</p>

<h2>Czy pójdziesz ze mną na randkę? 🥺</h2>

<div class="buttons">
    <button id="yesBtn">Tak! ❤️</button>
    <button id="noBtn">Nie 🙈</button>
</div>

<div id="planner" class="hidden">

    <h3>Zaplanujmy randkę ❤️</h3>

    <input type="date" id="date">

    <input type="time" id="time">

    <select id="activity">
        <option>🍕 Pizza</option>
        <option>🍣 Sushi</option>
        <option>🏊 Basen</option>
        <option>🚶 Spacer</option>
        <option>🎬 Kino</option>
        <option>💖 Coś innego</option>
    </select>

    <input
        id="details"
        placeholder="Dodatkowe życzenia ❤️"
    >

    <button id="finishBtn">
        Potwierdź ❤️
    </button>

</div>

<div id="result" class="hidden"></div>

</div>

<script>

emailjs.init({
    publicKey: "uZeNmW9NNflH_HhB_"
});

const noTexts = [
    "Nie 🙈",
    "Na pewno? 🥺",
    "Aleksandra ❤️",
    "Nie ma opcji 😅",
    "Spróbuj jeszcze raz 😘"
];

let index = 0;

const noBtn = document.getElementById("noBtn");

function moveButton(){

    index++;

    noBtn.textContent =
        noTexts[index % noTexts.length];

    noBtn.style.left =
        Math.random()*400 + "px";

    noBtn.style.top =
        Math.random()*80 + "px";
}

noBtn.addEventListener("mouseover", moveButton);

document
.getElementById("yesBtn")
.addEventListener("click", function(){

    document
    .getElementById("planner")
    .classList
    .remove("hidden");
});


document
.getElementById("finishBtn")
.addEventListener("click", function(){

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    const activity =
        document.getElementById("activity").value;

    const details =
        document.getElementById("details").value;

    emailjs.send(
        "service_randewu",
        "template_s77ncdr",
        {
            date: date,
            time: time,
            activity: activity,
            details: details
        }
    )
    .then(function(){

        const result =
            document.getElementById("result");

        result.classList.remove("hidden");

        result.innerHTML = `
            <h2>🎉 Randka zaakceptowana!</h2>

            <p>📅 ${date}</p>
            <p>🕒 ${time}</p>
            <p>${activity}</p>
            <p>${details}</p>

            <br>

            <p>
            Aleksandro ❤️<br>
            Dziękuję, że zgodziłaś się pójść ze mną na randkę.
            Nie mogę się doczekać naszego spotkania. ❤️
            </p>

            <br>

            <p>
            ✅ Odpowiedź została wysłana do Kuby ❤️
            </p>
        `;
    })
    .catch(function(error){

        console.error(error);

        alert(
            "Nie udało się wysłać maila. Sprawdź konfigurację EmailJS."
        );
    });

});

</script>

</body>
</html>
